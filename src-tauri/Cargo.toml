[package]
name = "clipstash_core"
version = "1.0.0"
description = "Local-first Smart Clipboard Manager, Secret-Masking Vault & Developer Transformation Studio"
authors = ["Alexandr Motologa"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "clipstash_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33.0", features = ["bundled"] }
arboard = "3.4.1"
regex = "1.11.1"
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }
sha2 = "0.10.8"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.8.5"
dirs = "6.0"
tokio = { version = "1.43", features = ["time", "rt-multi-thread"] }
log = "0.4"
